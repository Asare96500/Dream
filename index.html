        <section class="hero-section">
            <div class='img-section'>
                <img class="model" src="assests/pic.png" draggable="false" alt="model">
            </div>
            <div class="content-section">
                <h1>A Scent Beyond <br> Imagination</h1>
                <p>Discover a fragrance from rare florals 🌸<br> crafted for moments that linger forever</p>
                <a href="#" class="explore-btn"><span>Explore</span></a>
            </div>
        </section>

        <!--products section-->
        <section class="products-section">
            <main class="products-section-list">
                <div class="products-controls">
                    <div class="search-box">
                        <!--svg-->
                        <div class="search-icon">Q</div>
                        <input type="text" placeholder="Search products..." class="search-input"/>
                    </div>
                    <button class="products-filter-btn">Filter</button>
                    </div>
                    <div class="cards-wrapper">
                        <h1 style="color: white;">Cards go here</h1>
                    </div>
                
            </main>

            <aside class="products-section-sidebar">
                <div class="products-section-view">
                    <h1 style="color:white;">Active item details</h1>
                </div>
            </aside>
        </section>

        <!--about section-->
        <section class="about-section">
            <h2 style="color:white;">Welcome to about section</h2>

        </section>
    </div>
    </main>
